[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; deep+ : follow lib_deps fully even when source doesn't yet #include them.
; Needed during scaffolding because DRV2605 (and its SPI transitive dep) is
; declared in lib_deps but not yet referenced from src/.
lib_ldf_mode = deep+
lib_extra_dirs =
    ../../lib
    ../../../../shared/lib
lib_deps =
    lvgl/lvgl@^8.4.0
    adafruit/Adafruit NeoPixel
    kosme/arduinoFFT@^2.0.4
    adafruit/Adafruit DRV2605 Library
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -Isrc
