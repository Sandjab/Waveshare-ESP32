[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
lib_extra_dirs =
    ../../lib
    ../../../../shared/lib
lib_deps =
    lvgl/lvgl@^8.4.0
# esp_lcd_touch + esp_lcd_touch_cst816s (paquets du registre de composants ESP, absents
# du registre PlatformIO) sont vendorisés dans lib/ — voir lib/esp_lcd_touch*/.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -Isrc
    -DCONFIG_ESP_LCD_TOUCH_MAX_POINTS=1
    -DCONFIG_ESP_LCD_TOUCH_MAX_BUTTONS=0

# Tests natifs des générateurs de son (synthèse pure, aucune dépendance HW/I2S/LVGL).
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<sounds.cpp> +<sound_harp.cpp> +<sound_ping.cpp> +<sound_toneseq.cpp> +<sound_dualtone.cpp>
build_flags = -DRA_NATIVE_TEST -Isrc -std=gnu++17
